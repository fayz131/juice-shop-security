name: Trivy Security Scan Manual

on:
  push:
    branches: [ main ]

jobs:
  trivy-scan:
    name: Run Trivy Scanner
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install latest Trivy manually
      run: |
        wget https://github.com/aquasecurity/trivy/releases/download/v0.67.2/trivy_0.67.2_Linux-64bit.tar.gz
        tar -xzf trivy_0.67.2_Linux-64bit.tar.gz
        sudo mv trivy /usr/local/bin/
        trivy --version
        
    - name: Download HTML template
      run: |
        wget https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl
        ls -la html.tpl
        
    - name: Run Trivy scan and generate reports
      run: |
        echo "=== Table Format ==="
        trivy fs . --format table --exit-code 0
        
        echo "=== Generating HTML Report ==="
        trivy fs . --format template --template "./html.tpl" -o trivy-report.html
        
        echo "=== File Info ==="
        ls -la trivy-report.html
        echo "HTML content preview:"
        head -20 trivy-report.html || echo "No HTML file"
        
    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-security-reports
        path: trivy-report.html
        retention-days: 7
