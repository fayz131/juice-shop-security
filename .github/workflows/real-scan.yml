name: Real Security Scan - Dynamic HTML

on:
  push:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy and jq
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          sudo apt-get update && sudo apt-get install -y jq
          trivy --version

      - name: Run Trivy scan and save results
        run: |
          echo "=== Running Security Scan ==="
          # Сохраняем вывод в файл
          trivy fs . --format table --exit-code 0 2>&1 | tee scan-output.txt
          # Сохраняем JSON результаты
          trivy fs . --format json --output trivy-results.json
          echo "=== Raw scan output saved ==="

      - name: Generate SBOM
        run: |
          trivy fs . --format cyclonedx --output sbom.json

      - name: Create dynamic HTML from actual scan results
        run: |
          echo "=== Generating HTML from real scan data ==="
          
          # Создаем базовый HTML
          cat > report.html << 'HTMLHEAD'
<!DOCTYPE html>
<html>
<head>
    <title>Security Scan Report - Real Results</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; }
        .header { background: #2c3e50; color: white; padding: 20px; border-radius: 5px; }
        .summary { background: #e8f4fd; padding: 15px; border-radius: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Security Scan Report - Real Results</h1>
        <p>Generated from actual Trivy scan data</p>
        <p>Date: $(date)</p>
    </div>
    
    <div class="summary">
        <h2>Scan Information</h2>
        <p>This report is generated from the actual output of Trivy security scanning.</p>
        <p>Repository: ${{ github.repository }}</p>
        <p>Commit: ${{ github.sha }}</p>
    </div>
    
    <h2>Raw Scan Output</h2>
    <p>The following is the direct output from Trivy scan:</p>
    <pre>
HTMLHEAD

          # Вставляем РЕАЛЬНЫЕ результаты сканирования
          cat scan-output.txt >> report.html

          # Закрываем HTML
          cat >> report.html << 'HTMLTAIL'
    </pre>
    
    <h2>JSON Results Available</h2>
    <p>Detailed JSON results are available in the artifacts as <code>trivy-results.json</code></p>
    
    <h2>SBOM Generated</h2>
    <p>Software Bill of Materials (SBOM) is available as <code>sbom.json</code></p>
</body>
</html>
HTMLTAIL

          echo "Dynamic HTML report created from real scan data!"
          echo "File size: $(ls -la report.html | awk '{print $5}') bytes"

      - name: Upload real results
        uses: actions/upload-artifact@v4
        with:
          name: real-security-results
          path: |
            report.html
            sbom.json
            trivy-results.json
            scan-output.txt
          retention-days: 7
