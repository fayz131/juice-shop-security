name: Trivy Security Scan

on:
  push:
    branches: [ main ]

jobs:
  trivy-scan:
    name: Run Trivy Scanner
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
      
    - name: Install dependencies (skip if no lock file)
      run: |
        if [ -f "package-lock.json" ] || [ -f "yarn.lock" ] || [ -f "npm-shrinkwrap.json" ]; then
          npm ci
        else
          echo "No lock file found, skipping npm install"
        fi
        
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        
    - name: Generate HTML report
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy fs . --format template --template "@contrib/html.tpl" -o trivy-report.html || echo "Scan completed with findings"
        
    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: trivy-report.html
        retention-days: 7
