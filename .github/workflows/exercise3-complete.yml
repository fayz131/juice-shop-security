name: Exercise 3 - Complete Dependency Scanning

on:
  push:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy dependency vulnerability scan
        run: |
          echo "=== Scanning for vulnerable dependencies ==="
          trivy fs . --scanners vuln --format table --exit-code 0
          trivy fs . --scanners vuln --format json --output vulnerability-results.json

      - name: Generate proper SBOM
        run: |
          echo "=== Generating comprehensive SBOM ==="
          trivy fs . --format cyclonedx --output sbom.json

      - name: Scan for secrets
        run: |
          echo "=== Scanning for secrets ==="
          trivy fs . --scanners secret --format json --output secret-results.json

      - name: Create comprehensive HTML report
        run: |
          cat > report.html << 'HTML_EOF'
<!DOCTYPE html>
<html>
<head>
    <title>Dependency Security Scan - Exercise 3</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .vulnerability { background: #fff3cd; padding: 10px; margin: 5px 0; }
        .secret { background: #ffeaea; padding: 10px; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>Dependency Security Scan Report</h1>
    <div class="section">
        <h2>Scan Information</h2>
        <p>Repository: ${{ github.repository }}</p>
        <p>Date: $(date)</p>
    </div>
    <div class="section">
        <h2>Dependency Vulnerabilities</h2>
        <p>Check vulnerability-results.json for detailed dependency scan results</p>
    </div>
    <div class="section">
        <h2>Secrets Found</h2>
        <p>Check secret-results.json for secret detection results</p>
    </div>
    <div class="section">
        <h2>SBOM Generated</h2>
        <p>Software Bill of Materials: sbom.json</p>
    </div>
</body>
</html>
HTML_EOF

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exercise3-complete-results
          path: |
            report.html
            sbom.json
            vulnerability-results.json
            secret-results.json
          retention-days: 7
