name: Exercise 3 - Final Dependency Scan

on:
  push:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy vulnerability scan
        run: |
          echo "=== Scanning for vulnerable dependencies ==="
          trivy fs . --scanners vuln --format table --exit-code 0
          trivy fs . --scanners vuln --format json --output vuln-results.json

      - name: Run Trivy secret scan
        run: |
          echo "=== Scanning for secrets ==="
          trivy fs . --scanners secret --format table --exit-code 0
          trivy fs . --scanners secret --format json --output secret-results.json

      - name: Generate SBOM
        run: |
          echo "=== Generating SBOM ==="
          trivy fs . --format cyclonedx --output sbom.json

      - name: Create HTML report
        run: |
          echo "=== Creating HTML report ==="
          cat > report.html << 'HTML_EOF'
<!DOCTYPE html>
<html>
<head>
    <title>Exercise 3 - Security Scan Report</title>
</head>
<body>
    <h1>Security Scan Report</h1>
    <p>Dependency scanning completed successfully.</p>
</body>
</html>
HTML_EOF

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: final-exercise3-results
          path: |
            report.html
            sbom.json
            vuln-results.json
            secret-results.json
          retention-days: 7
