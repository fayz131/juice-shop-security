name: Trivy Dependency Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget -y
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.2_Linux-64bit.deb
          sudo dpkg -i trivy_0.50.2_Linux-64bit.deb

      - name: Generate SBOM (CycloneDX)
        run: |
          trivy sbom --output sbom.json --format cyclonedx .

      - name: Generate HTML vulnerability report
        run: |
          trivy fs --format template \
            --template "@contrib/html.tpl" \
            --output report.html .

      - name: Upload artifacts (HTML report + SBOM)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            report.html
            sbom.json
          compression-level: 6
