name: Trivy SCA Scan

on:
  push:
    branches: [ "main" ]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Install Node + Yarn
      - name: Install Node dependencies (Yarn)
        run: |
          corepack enable
          yarn install --frozen-lockfile

      # Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sudo sh -s -- -b /usr/local/bin

      # Generate SBOM in SPDX JSON
      - name: Generate SBOM
        run: trivy fs --format spdx-json --output sbom.json .

      # Generate HTML vulnerability report
      - name: Scan vulnerabilities
        run: trivy fs --format html --output trivy_report.html .

      # Upload artifacts
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy_report.html
