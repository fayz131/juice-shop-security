name: Trivy Dependency Scan

on:
  push:
    branches: [ "main" ]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.53.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.53.0_Linux-64bit.deb

      - name: Install Node dependencies
        run: npm ci

      - name: Generate SBOM
        run: trivy fs --format spdx-json --output sbom.json .

      - name: Scan vulnerabilities
        run: trivy fs --format html --output trivy_report.html .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy_report.html
