name: Trivy SCA Scan

on:
  push:
    branches: [ "main" ]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies (Yarn)
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Install Trivy
        run: |
          sudo apt-get update
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sudo sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: trivy fs --format spdx-json --output sbom.json .

      - name: Download HTML template
        run: curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o trivy-html.tpl

      - name: Scan vulnerabilities (HTML)
        run: trivy fs --format template --template @trivy-html.tpl --output trivy_report.html .

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy_report.html
