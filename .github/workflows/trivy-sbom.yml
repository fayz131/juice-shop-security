name: Trivy SCA Scan

on:
  push:
    branches: [ "main" ]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.53.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.53.0_Linux-64bit.deb

      - name: Install dependencies
        run: npm ci

      # === SBOM генерируем в формате SPDX (без ошибок и поддерживается Trivy) ===
      - name: Generate SBOM
        run: trivy fs --format spdx-json --output sbom.json .

      # === Полное сканирование уязвимостей приложения (а не sbom!) ===
      - name: Scan vulnerabilities
        run: trivy fs --format html --output trivy_report.html .

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy_report.html
