name: Trivy SCA Scan

on:
  push:
    branches: [ "main" ]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node dependencies
        run: npm ci

      # УСТАНОВКА TRIVY — РАБОЧИЙ ВАРИАНТ
      - name: Install Trivy
        run: |
          sudo apt-get update
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sudo sh -s -- -b /usr/local/bin

      # Генерация SBOM в SPDX JSON (поддерживается Trivy)
      - name: Generate SBOM
        run: trivy fs --format spdx-json --output sbom.json .

      # HTML отчёт
      - name: Scan vulnerabilities
        run: trivy fs --format html --output trivy_report.html .

      # Артефакт
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy_report.html
