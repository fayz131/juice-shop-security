name: Trivy Dependency Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget jq

          LATEST_URL=$(curl -s https://api.github.com/repos/aquasecurity/trivy/releases/latest \
            | jq -r '.assets[] | select(.name | test("Linux-64bit.deb$")) | .browser_download_url')

          echo "Downloading: $LATEST_URL"
          wget "$LATEST_URL"
          sudo dpkg -i $(basename "$LATEST_URL")

      - name: Generate SBOM
        run: |
          trivy sbom --output sbom.json --format cyclonedx .

      - name: Generate HTML report
        run: |
          trivy fs . --format template --template "@contrib/html.tpl" --output report.html

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            sbom.json
            report.html
