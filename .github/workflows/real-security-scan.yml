name: Real Security Scan

on:
  push:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Run Trivy scan
        run: |
          echo "=== Running Security Scan ==="
          trivy fs . --format table --exit-code 0
          trivy fs . --format json --output trivy-results.json

      - name: Generate SBOM
        run: |
          trivy fs . --format cyclonedx --output sbom.json

      - name: Create simple HTML report
        run: |
          cat > report.html << 'HTMLEND'
<!DOCTYPE html>
<html>
<head>
    <title>Security Scan Report</title>
</head>
<body>
    <h1>Security Scan Complete</h1>
    <p>Trivy scan executed successfully.</p>
    <p>Check workflow logs for detailed findings.</p>
</body>
</html>
HTMLEND

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: |
            report.html
            sbom.json
            trivy-results.json
          retention-days: 7
