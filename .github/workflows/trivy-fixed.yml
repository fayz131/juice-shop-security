name: Trivy Security Scan Fixed

on:
  push:
    branches: [ main ]

jobs:
  trivy-scan:
    name: Run Trivy Scanner
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install latest Trivy
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy --version
        
    - name: Download HTML template
      run: |
        curl -sLO https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl
        ls -la html.tpl
        
    - name: Run Trivy scan
      run: |
        trivy fs . --format table --exit-code 0
        
    - name: Generate HTML report
      run: |
        trivy fs . --format template --template "./html.tpl" -o trivy-report.html
        echo "HTML file info:"
        ls -la trivy-report.html
        
    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-reports-final
        path: trivy-report.html
        retention-days: 7
